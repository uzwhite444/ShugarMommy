    <!-- Structured data: the studio, its services and the FAQ, so Google can
         show the address, opening hours, prices and expandable questions.

         Prices mirror src/data.ts — keep the two in step.

         A body zone genuinely costs two different amounts (STANDARD_PRICES vs
         RENATA_PRICES), so it is published as an AggregateOffer carrying
         lowPrice + highPrice. A plain Offer has one `price`, and either choice
         would be a false statement: the low figure understates a visit with the
         top master, the high one overstates every other booking. AggregateOffer
         is a subtype of Offer, so it is valid wherever an Offer is expected —
         including inside an OfferCatalog — and it is the schema.org-sanctioned
         way to say "this service is sold at a range".

         Face sugaring, brows/lashes and polymer depilation are one master's
         alone: exactly one price exists, so those stay plain Offers. Полимерные
         зоны sit in their own catalog AND name the technique, because they are
         not sugaring and cost more than the sugaring zone of the same name.

         Подбородок is absent on purpose — the studio has given no price for it,
         an Offer without one is not eligible for rich results, and inventing a
         number would publish a price the studio never quoted.

         Hours are the studio envelope (STUDIO_HOURS), widest of the masters'
